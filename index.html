<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目文件访问</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #fff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .file-list {
            list-style: none;
        }
        
        .file-item {
            margin-bottom: 20px;
        }
        
        .file-link {
            display: block;
            padding: 15px 20px;
            background-color: #1e90ff;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .file-link:hover {
            background-color: #187bcd;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.3);
        }
        
        .file-type {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
            text-align: center;
        }
        
        .description {
            color: #666;
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>项目文件访问</h1>
        <ul class="file-list">
            <li class="file-item">
                <a href="enterprise-info.html" class="file-link" target="_blank">访问企业信息页面</a>
                <div class="file-type">HTML文件</div>
            </li>
            <li class="file-item">
                <a href="微信图片_20260101002312_370_3.jpg" class="file-link" target="_blank">查看信任徽章图片</a>
                <div class="file-type">JPG图片</div>
            </li>
        </ul>
        <p class="description">点击上方链接访问项目文件</p>
    </div>
</body>
</html>
